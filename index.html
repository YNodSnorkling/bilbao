{id:'S1',t:'Das Ende der Industrie',amt:500,dest:'43.26353654959429,-2.923348349534742',mode:'walking',
 arrive:'Ziel: Arenal / Rathausblick (Koordinaten 43.2635, −2.9233).',
 sit:['Ihr steht am Arenal, dem alten Zentrum der Stadt, mit Blick auf den Fluss und das Rathaus. Vor euch liegt eine Stadt, deren Wirtschaft sich über ein Jahrhundert auf Stahl, Schiffbau und Hafen gestützt hat. Die Aufträge bleiben aus. Politik und Gewerkschaften fordern, die Werften zu retten. Banker und Berater sagen, das Geschäftsmodell sei tot.'],
 q:'Ist die Krise zyklisch oder strukturell?',qx:'Wenn sie zyklisch ist, überbrückt ihr die Durststrecke und haltet die bestehende Wirtschaftsstruktur. Wenn sie strukturell ist, hilft nur ein radikaler Wandel, und jede Mio für die alte Industrie ist verloren.',
 dossier:[],
 opts:{Industrie:['Modernisierung der bestehenden Werften und Stahlwerke','schnelle Stabilisierung, Arbeitsplätze bleiben','Strukturwandel wird verschoben, Umweltbelastung bleibt'],Hafen:['Ausbau und Modernisierung der Hafenanlagen','neue Handels- und Logistikfunktion','Ergebnis hängt von der Weltkonjunktur ab'],Bildung:['Berufsschulen und Hochschulen für neue Qualifikationen','Fundament für neue Branchen','wirkt spät, die Arbeitslosen von heute profitieren kaum'],Infrastruktur:['Erneuerung von Verkehrs- und Versorgungsnetzen','bessere Standortqualität für Investoren','wirkt verzögert, kein Sofort-Effekt auf Arbeitsplätze'],Umwelt:['Sanierung von Fluss und Luft','Lebensqualität steigt sofort','Nutzen für die Wirtschaft ist unsicher und kommt spät']},
 md:[{t:'Sozialplan für die Entlassenen',o:{B:['Umschulungsprogramm','Entlassene werden für neue Berufe qualifiziert','Betriebe verlieren kurzfristig Fachkräfte'],C:['Umschulung plus Frühverrentung','große Entlastung des Arbeitsmarkts und starke Qualifizierung','Frust und sozialer Druck, die Lebensqualität leidet kurzfristig']},a:'Kein Programm'},
     {t:'Umgang mit Not leidenden Großbetrieben',o:{B:['Überbrückungshilfen','Arbeitsplätze werden kurzfristig gesichert','Strukturwandel wird verschleppt'],C:['Rettungspaket','die großen Betriebe bleiben am Leben','Innovationskraft leidet deutlich']},a:'Keine Staatshilfe'}],

{id:'S3',t:'Umwelt als Infrastruktur',amt:200,dest:'Zubizuri, Bilbao',mode:'walking',
 arrive:'Ziel: Uferpromenade Abandoibarra an der Fußgängerbrücke Zubizuri, zu Fuß am Fluss entlang, ca. 20 Minuten.',
 sit:['Ihr steht am linken Ufer des Nervión, in Abandoibarra. 1990 sieht dieser Ort völlig anders aus als heute. Statt einer Promenade gibt es hier eine stillgelegte Werft, verfallene Hafenanlagen, Lagerhallen und Gleisanlagen. Das Gelände gehört größtenteils Staatsunternehmen und liegt brach. Der Fluss daneben ist so stark verschmutzt, dass in ihm kaum noch etwas lebt. Seit dem Hochwasser von 1983 weiß jeder in der Stadt, wie verletzlich die Ufer sind.','Die Stadtkasse ist leer, die Arbeitslosigkeit hoch. Wer jetzt Geld in Fluss und Boden steckt, hat dieses Geld nicht für Arbeitsplätze.'],
 q:'Ist Umwelt ein Kostenfaktor oder eine wirtschaftliche Investition?',qx:'Kann eine Stadt mit Umweltpolitik wirtschaftliches Wachstum erzeugen? Oder ist saubere Luft ein Luxus, den man sich erst leisten kann, wenn die Wirtschaft läuft?',
 dossier:['Der Nervión ist stark verschmutzt und gilt als biologisch fast tot.','Das Hochwasser von 1983 hat große Teile der Stadt überschwemmt. Das Wasser stieg bis zu drei Meter.','Die Stadt hat dem Fluss lange den Rücken gekehrt. Es gibt kaum Brücken für Fußgänger, weil sie die Schifffahrt behindert hätten.','Auf dem Gelände stehen eine alte Werft, Hafenanlagen und Gleise. Die Böden sind durch Jahrzehnte der Industrie belastet.','Umweltprojekte sind teuer, und ihre Wirkung auf die Wirtschaft kommt meist spät.'],
 opts:{Fluss:['Kläranlagen, Abwassernetz und Gewässerreinigung des Nervión','Lebensqualität steigt sofort, das Image der Stadt verbessert sich','großes Projekt, politisch umkämpft, wirtschaftlicher Nutzen kommt spät'],Gruen:['Parks und Grünzüge auf freien Flächen am Fluss','schneller sichtbarer Gewinn an Lebensqualität, geringe Kosten an politischem Kapital','bringt der Wirtschaft kaum etwas, der Fluss bleibt verschmutzt'],Altlast:['Reinigung der belasteten Industrieböden','macht Flächen nutzbar und stiftet langfristig Wert','wirkt verzögert und ist technisch aufwändig']},
 md:[{t:'Umgang mit Betrieben am Fluss',o:{B:['Emissionsauflagen','Betriebe müssen Abwasser und Abgase reduzieren','Betriebe leiden unter den Kosten'],C:['Strikte Auflagen und Stilllegung der schlimmsten Anlagen','Luft und Wasser verbessern sich stark','Arbeitsplätze gehen verloren, die Wirtschaft schwächelt']},a:'Keine neuen Auflagen'},
     {t:'Hochwasserschutz für die Uferviertel',o:{B:['Teilschutz','die gefährdetsten Uferviertel werden gesichert','Mauern und Bauwerke trennen die Stadt weiter vom Wasser'],C:['Vollschutz','durchgängiger Schutz entlang des Flusses','Die Stadt wird stark vom Wasser abgeschottet, die Attraktivität leidet']},a:'Kein zusätzlicher Schutz'}],
 fq:'Wie viel Geld wird die Region insgesamt in die Sanierung des Nervión stecken? (Antwort in Mrd €)',
 imp:['Du steckst 200 Mio in einen Fluss, während Leute arbeitslos sind?','Wer glaubt wirklich, dass saubere Luft Jobs bringt?','Warum nimmst du Grünflächen statt den Fluss selbst zu sanieren?','Wie viel Wachstum ist es wert, wenn dabei der Fluss tot bleibt?']},
{id:'S2',t:'Infrastruktur als Wachstumsmotor',amt:300,dest:'Plaza Moyúa, Bilbao',mode:'walking',
 arrive:'Ziel: Plaza Moyúa, zu Fuß, ca. 10 Minuten.',
 sit:['Ihr steht auf der Plaza Moyúa, dem Mittelpunkt des Ensanche, des großen Stadterweiterungsviertels von Bilbao. Hier laufen die Hauptverkehrsströme der Stadt zusammen. Im Großraum leben rund eine Million Menschen, und Tag für Tag drängen sie sich auf überlasteten Straßen und in einem Nahverkehr, dessen älteste Teile aus dem 19. Jahrhundert stammen. Der Hafen liegt noch mitten in der Stadt am Fluss. Junge, gut ausgebildete Basken verlassen die Region.','Ihr habt 300 Mio zu vergeben, und alle wollen etwas davon: die Pendler, die Hafenbetreiber, die Universitäten.'],
 erlebnis:['Bevor ihr entscheidet, steigt ihr in die Metro: von Moyúa bis San Mamés und wieder zurück. Beobachtet drei Dinge:','Wie lange dauert die Fahrt, und wie lange hättet ihr zu Fuß gebraucht?','Wie viele Menschen sind unterwegs, und wohin?','Was würde eine solche Verbindung für die Standortqualität eurer Stadt bedeuten?'],
 q:'Welche Infrastrukturinvestition erzeugt den größten langfristigen Hebel?',qx:'Ihr könnt kurzfristig sichtbare Ergebnisse erzielen oder auf einen Hebel setzen, der erst in Runden wirkt. Beides ist legitim, aber nicht beides gleichzeitig.',
 dossier:['Der Großraum Bilbao hat rund eine Million Einwohner.','Die Straßen sind überlastet, der Verkehr in der Innenstadt gilt als eines der größten Probleme der Stadt.','Der Nahverkehr beruht zum Teil auf einer Vorortbahn, die seit dem späten 19. Jahrhundert besteht.','Der Hafen und seine Anlagen dominieren das Flussufer mitten in der Stadt.','Junge, gut ausgebildete Basken wandern ab, weil es an Perspektiven fehlt.','Große Infrastrukturprojekte brauchen Jahre. Wer heute baut, erntet erst in zwei oder drei Runden.'],
 opts:{Metro:['Schienennetz für den Nahverkehr im Großraum','entlastet die Straßen, erhöht die Attraktivität der Stadt stark','sehr teuer, lange Bauzeit, politisch großes Risiko'],Strassen:['Ausbau von Straßen und Ringen','schnelle Entlastung, hoher kurzfristiger Nutzen','zieht mehr Verkehr an, belastet die Lebensqualität'],Hafen:['Modernisierung und Ausbau der Hafenanlagen','stärkt die wirtschaftliche Basis der Stadt','Abhängigkeit von Weltkonjunktur und Seehandel'],Universitaet:['Ausbau der Hochschulen und Forschungsstandorte','hält Talente in der Region, Fundament für neue Branchen','wirkt spät, Verkehr und Hafen bleiben ungelöst']},
 md:[{t:'Bautempo',o:{B:['Beschleunigtes Bauen','Projekte werden schneller fertig','Baulärm und Sperrungen belasten die Anwohner'],C:['Rund um die Uhr bauen','Maximales Tempo','starke Belastung, die Lebensqualität leidet spürbar']},a:'Regelbetrieb'},
     {t:'Anbindung der Außenbezirke',o:{B:['Wichtige Vororte anbinden','bessere Erreichbarkeit für Pendler','Mittel sind gebunden, Wirtschaft kämpft kurzfristig'],C:['Umfassendes Netz','die ganze Region wird erschlossen','hohe Kosten, die Wirtschaft leidet spürbar']},a:'Fokus auf das Zentrum'}],
 fq:'Wie viele Fahrgäste pro Jahr würde eine moderne Metro im Großraum Bilbao nach dem Ausbau nutzen? (Mio Fahrgäste pro Jahr; Orientierung: der Großraum hat rund eine Million Einwohner)',
 imp:['Du hast 300 Mio in etwas gesteckt, das erst in zwei Runden wirkt?','Wie lange hältst du als Stadtführer durch, wenn nach der Wahl noch nichts fährt?','Warum bist du bei Straßen geblieben, wenn alle im Stau stehen?','Was ist mehr wert: ein Hafen, der heute Jobs sichert, oder eine Universität, die in zehn Jahren zahlt?']},
{id:'M',t:'Pintxos-Komitee – Die Neuerfindung der Stadt',amt:100,dest:'Bar El Globo, Calle Diputación 8, Bilbao',mode:'walking',
 arrive:'Ziel: Bar El Globo, Diputación 8. Ausgang Diputación der Metro Moyúa, wenige Schritte, ca. 2 Minuten zu Fuß.',
 auftrag:{t:'Auftrag: Tapas bestellen',b:'Als Vorsitzender bestellst du für die ganze Runde Pintxos und Getränke, bevor du die Sitzung eröffnest.',tips:['Pintxos liegen auf der Theke: einfach hinzeigen oder den Kellner fragen („Esto y esto, por favor“). Bezahlt wird meist am Ende; die Zahnstocher oder Teller werden gezählt.','Für fünf Personen reichen am Anfang 6 bis 8 Pintxos zum Teilen, nachbestellen geht jederzeit. Klassiker: Tortilla, Gilda (Olive, Peperoni, Sardelle am Spieß), Croquetas, Txipirones (kleine Tintenfische).','Getränke: Txakoli, Sidra (Apfelwein), „caña“ (kleines Bier) oder „zurito“ (noch kleiner, im Baskenland üblich). Ein „Kalimotxo“ ist Rotwein mit Cola.','Sag am Anfang kurz, dass ihr etwas länger sitzt und diskutiert. Das ist in einer Pintxos-Bar kein Problem, aber so wird niemand ungeduldig.']},
 sit:['Ihr sitzt in einer klassischen Pintxos-Bar im Zentrum von Bilbao. Auf der Theke liegen kleine Gerichte, ihr teilt sie euch, ihr trinkt etwas dazu. Das ist Alltag in der Stadt und eine Esskultur, die sich über Generationen entwickelt hat.','Die Frage ist, ob sie mehr sein kann als Alltag. Bilbao hat 1990 ein Imageproblem: Die Stadt gilt als grau, heruntergerückt und politisch belastet. Kaum jemand kommt freiwillig hierher, und wer hier lebt, weiß nicht, warum Fremde kommen sollten. Ihr habt noch 100 Mio und die Aufgabe, die Stadt neu zu erfinden.'],
 erlebnis:['Fallstudie: Die Bar, in der ihr sitzt (ca. 10 Minuten):','Was macht diese Bar attraktiv, und für wen?','Ist das ein Geschäftsmodell, das eine Stadt tragen kann, oder nur ein schöner Nebeneffekt?','Wie viel davon entsteht von allein, und wie viel kann die Stadt gezielt fördern?'],
 q:'Was macht eine Stadt tatsächlich attraktiv?',qx:'Sind es gute Restaurants, eine schöne Altstadt, Touristen, Arbeitsplätze oder Zukunftsbranchen? Und wer kommt zuerst: die Menschen oder die Angebote?',
 dossier:['Bilbao hat 1990 praktisch keine Tourismusbranche.','Das Image der Stadt leidet unter dem wirtschaftlichen Niedergang und unter politischen Spannungen und Gewalt im Baskenland.','Der Casco Viejo ist das mittelalterliche Herz der Stadt und seit 1979 Fußgängerzone. 1983 hat das Hochwasser Teile davon überflutet. Es gibt hunderte Bars und Restaurants, aber die Esskultur ist vor allem lokal verankert.','Wer heute Arbeit sucht, geht oft weg. Wer bleibt, fährt selten aus Neugier durch die eigene Stadt.','Attraktivität entsteht meist verzögert: zuerst Lebensqualität, dann Aufmerksamkeit, dann Besucher, dann Wirtschaft.'],
 opts:{Gastro:['Förderung von Gaststätten, Märkten und regionaler Küche','stärkt Alltagsqualität und Identität, kaum politisches Risiko','der Effekt bleibt lokal, Fremde kommen nicht automatisch'],Tourismus:['Marketing, Informationsangebote und touristische Infrastruktur','Aufmerksamkeit und Besucher','es gibt noch wenig zu zeigen, die Wirkung hängt vom Angebot ab'],Altstadt:['Sanierung und Belebung des Casco Viejo','steigert Lebensqualität und Identität','wirkt begrenzt auf ein Viertel, Anwohner könnten verdrängt werden'],Techpark:['Flächen und Infrastruktur für technologieorientierte Unternehmen','zieht Unternehmen und Wissen an','Ergebnis unsicher, berührt die Alltagsqualität kaum']},
 md:[{t:'Förderung von Gastronomie und Handel',o:{B:['Gründungsförderung für Wirte und Läden','neue Betriebe entstehen, die Vielfalt wächst','Mieten steigen, Anwohner spüren die Folgen'],C:['Großes Förderprogramm','die Szene wächst stark','Verdrängung von Anwohnern, die Lebensqualität leidet']},a:'Keine Förderung'},
     {t:'Image und Stadtmarketing',o:{B:['Imagekampagne','die Stadt wird in Spanien und Europa bekannter','Es gibt wenig, das die Versprechen einlöst, die Wirtschaft leidet kurzfristig'],C:['Internationale Kampagne','große Aufmerksamkeit für die Stadt','Besucher belasten die Einwohner, die Lebensqualität sinkt später']},a:'Keine Kampagne'}],
 fq:'Welcher Wirtschaftsbereich stellt im Jahr 2020 in Bilbao die meisten Arbeitsplätze? (Industrie / Dienstleistungen / Tourismus und Gastronomie / Technologie und Forschung)',
 imp:['Du hast 100 Mio in Tapas gesteckt?','Warum soll jemand wegen eines Technologieparks nach Bilbao ziehen?','Wer kommt zuerst: die Touristen oder die Angebote?','Ist eine schöne Altstadt ein Wirtschaftsfaktor oder nur Dekoration?','Wie viel Marketing darf eine Stadt ausgeben, die noch nichts zu zeigen hat?']},
{id:'S4',t:'Die Technologie-Wette',amt:300,dest:'Riverside Tavern, Deustuibarra 43, Bilbao',mode:'transit',
 arrive:'Ziel: Riverside Tavern, Deustuibarra 43 in Deusto. Metro ab Moyúa (Ausgang Diputación) bis Sarriko (4 Stationen), dann der Story-Weg zu Fuß. Dauer ca. 25 Minuten.',
 auftrag:{t:'Auftrag: Bier bestellen',b:'Als Vorsitzender bestellst du in der Bar für alle Bier und gegebenenfalls etwas zu essen, bevor du die Sitzung eröffnest.',tips:['„Una caña, por favor“ ist ein kleines Zapfbier (ca. 0,2 bis 0,3 l), „una pinta“ ein großes. Alkoholfrei: „una cerveza sin“.','Frag nach regionalem Bier vom Fass; im Baskenland gibt es viele kleine Brauereien. Wenn jemand lieber etwas anderes möchte: Wasser („agua“), Kaffee („un café“) oder Cola sind überall zu haben.','Bezahlt wird in Bars üblicherweise am Tresen oder am Ende am Tisch. Trinkgeld ist nicht üblich, Aufrunden ist freundlich.','Die Bar öffnet laut Verzeichnis samstags ab 10:00 Uhr (nicht verifiziert). Ausweichort: Tapasbar Zorrotzaurre, Deustuibarra 31.']},
 story:['Stopp 1 – Metro-Ausgang: „Wir sind am Rand der Stadt. Bis in die 1960er Jahre lag hier ein Teil von Bilbaos Industrie: Fabriken, Werften und Hafenbetriebe entlang des Flusses. Wer hier gearbeitet hat, hat Bilbao reich gemacht.“','Stopp 2 – Blick zur Insel: „Vor euch liegt Zorrotzaurre. In den 1950er und 1960er Jahren wurde hier ein Kanal gegraben, damit Schiffe besser fahren können. 1968 wurde der Bau gestoppt, 400 Meter fehlten. Seitdem ist die Insel eine Halbinsel, zu der kaum jemand kommt. Die Industrie ist seit den 1970er Jahren weggebrochen, und kaum noch jemand wohnt hier.“','Stopp 3 – Vor der Bar: „Stellt euch vor, es ist 1990. Der Boden ist belastet, die Fabriken stehen leer. Und gleich kommt ein Anruf von einem Konzern, der hier Chips bauen will. Wir setzen uns jetzt und überlegen, was wir tun.“'],
 sit:['Ihr sitzt in der Riverside Tavern in Deusto, am Fuß der Insel Zorrotzaurre, die ihr auf dem Weg hierher kennengelernt habt. Sie ist eine ehemalige Industriehalbinsel im Fluss. Hier haben in den 1960er Jahren Fabriken und Hafenbetriebe gearbeitet. Heute ist es ein verlassenes Gebiet mit belasteten Böden, kaum Bewohnern und schlechter Anbindung an die Innenstadt. Es ist genau der Ort, den niemand haben will, und deshalb ist er günstig.','Dann kommt eine Nachricht: Ein internationaler Technologiekonzern sucht einen Standort in Europa. Er will eine Chipfabrik bauen und fragt, wer ihm Fläche, Infrastruktur, Fachkräfte und Fördermittel bietet. Mehrere europäische Regionen bewerben sich. Auch Bilbao könnte es versuchen, mit Zorrotzaurre als Standort und mit 300 Mio auf dem Tisch.'],
 q:'Soll Bilbao auf Technologie setzen?',qx:'Das ist die größte und riskanteste Entscheidung des Tages. Wer gewinnt, hat die Zukunft der Stadt neu aufgestellt. Wer verliert, hat 300 Mio in ein Projekt gesteckt, das möglicherweise nie die erwartete Wirkung erzielt.',
 dossier:['Zorrotzaurre ist eine künstliche Halbinsel, die in den 1950er und 1960er Jahren durch den Bau des Deusto-Kanals entstand. Sie ist rund 60 Hektar groß.','Seit den 1970er Jahren ist das Gebiet im industriellen und sozialen Niedergang. Die Böden sind belastet, nur wenige Menschen leben dort.','Ein Chipwerk ist extrem kapitalintensiv. Zwischen Standortbeschluss und erstem gefertigtem Chip vergehen Jahre.','Der Konzern ist auf Fachkräfte, Zulieferer und eine zuverlässige Infrastruktur angewiesen. Bilbao hat durch Werften und Stahlwerke viel Ingenieurwissen, aber keine Erfahrung mit Halbleitern.','Der Standort ist schlecht an die Innenstadt angebunden. Das fühlt ihr gerade selbst.','Wer eine Insel entwickeln will, muss zuerst die Infrastruktur liefern.'],
 opts:{Chip:['Anschubfinanzierung, Fläche und Infrastruktur für das Chipwerk des Konzerns','stärkster möglicher Hebel auf Innovation und Wirtschaft','extrem hohes Risiko, hohe Abhängigkeit von einem Konzern, Umweltbelastung, politisch umstritten'],Forschung:['Forschungsinstitute und Labore mit internationaler Ausrichtung','baut Wissen und Innovationskraft dauerhaft auf','unklar, ob daraus Wirtschaft wird, Wirkung braucht viele Runden'],Universitaet:['Ausbau der Hochschulen, Lehre und Ausbildung','bildet Talente aus und hält sie in der Region','wirkt sehr spät, keine direkte Industrie'],Techpark:['Flächen und Infrastruktur für technologieorientierte Unternehmen','günstiger Einstieg, mehrere kleine Wetten statt einer großen','kein Ankerinvestor, Ergebnis unsicher']},
 md:[{t:'Fachkräfte',o:{B:['Anwerbeprogramm für Ingenieure','Fachkräfte kommen aus dem Ausland','Wohnraum wird knapp, die Lebensqualität leidet'],C:['Internationales Talent-Paket','große Zuwanderung hoch qualifizierter Kräfte','starker Druck auf Wohnungen und Stadtleben']},a:'Kein Programm'},
     {t:'Sonderkonditionen für Investoren',o:{B:['Steuer- und Flächenanreize','die Region wird als Standort konkurrenzfähig','Kritik am Ausverkauf der Stadt'],C:['Großzügiges Anreizpaket','die Region wird zur ersten Wahl','massive Kritik, das Image der Stadt leidet']},a:'Keine Anreize'}],
 fq:'Wie viele Jahre vergehen von der Standortentscheidung bis zum ersten gefertigten Chip? (Zahl in Jahren)',
 imp:['Santa Clara und Shenzhen hatten einen Staat, Kapital oder eine Universität im Rücken. Was hat Bilbao 1990? Und reicht das?','Du setzt auf einen einzigen Konzern, wer fängt die Stadt auf, wenn er geht?','Warum investierst du in die Universität statt in ein Werk, das sofort Jobs schafft?','Ist ein Technologiepark ohne Ankerinvestor mehr als ein leerer Gewerbepark?','Du hast 20 Punkte politisches Kapital für eine Wette ausgegeben. War das klug?']},
{id:'S5',t:'Die Kultur-Wette',amt:120,dest:'Guggenheim Museum Bilbao',mode:'transit',
 arrive:'Ziel: Guggenheim, Außenbereich (kein Museumsbesuch). Metro von Sarriko bis Moyúa, dann ca. 10 Minuten zu Fuß. Dauer ca. 25 Minuten.',
 sit:['Ihr steht an einer Biegung des Flusses, an einem Ort, an dem ihr heute Morgen schon vorbeigelaufen seid. Stellt euch das Jahr 1990 vor. Hier liegen verfallene Hafenanlagen, Lagerhallen und eine stillgelegte Werft. Die Fläche am Wasser ist frei, und sie gehört dem Staat. Die Stadt hat kaum internationale Sichtbarkeit und kaum Touristen. Wer über Bilbao nachdenkt, denkt an Stahl, Niedergang und Schlagzeilen, nicht an einen Ort, den man besuchen will.','Ihr habt 120 Mio für eine einzige große Investition, und es ist die letzte des Tages.'],
 q:'Welche einmalige Investition kann eine Stadt weltweit sichtbar machen?',qx:'Eine Investition, die nicht nur Geld bindet, sondern der Welt zeigt, dass diese Stadt existiert. Ist das ein Luxus, den sich Bilbao nicht leisten kann, oder der nächste Hebel für Aufmerksamkeit und Wirtschaft?',
 dossier:['Die freie Fläche am Fluss gehört Staatsunternehmen, die sie nicht mehr brauchen. Sie ist zentral gelegen und von der Altstadt aus zu Fuß zu erreichen.','Bilbao hat praktisch keine Tourismusbranche und ein schwaches Image.','Ein Leuchtturmprojekt ist einmalig, teuer und politisch riskant. Es gibt keine Garantie, dass jemand kommt.','Aufmerksamkeit entsteht verzögert: erst Image, dann Besucher, dann Wirtschaft.','Dies ist die letzte Investition. Alle Wirkungen, die dann noch ausstehen, werden im Finale bis 2025 gebucht.','Wer stark verschuldet ist, kann stattdessen Schulden abbauen und sich Handlungsspielraum sichern.'],
 opts:{Kultur:['ein einmaliges Bauwerk mit internationaler Strahlkraft','große Aufmerksamkeit, Besucher, später Wirtschaft','hoher politischer Preis, Erfolg ungewiss'],Universitaet:['weiterer Ausbau der Hochschulen','bildet Talente aus, stärkt Innovation','wirkt spät, keine Sichtbarkeit nach außen'],Forschung:['Forschungseinrichtungen und Labore','baut Wissen auf','unklar, ob daraus Wirtschaft wird'],Hafen:['weitere Modernisierung der Hafenanlagen','stärkt die wirtschaftliche Basis','Abhängigkeit von Weltkonjunktur'],Schuldenabbau:['Schulden werden um 120 Mio getilgt','weniger Zinsen, weniger politischer Druck','kein Wachstum, keine Wirkung auf Kennzahlen']},
 md:[{t:'Wer baut?',o:{B:['Internationaler Architekturwettbewerb','Entwürfe kommen aus aller Welt, die Stadt gewinnt Aufmerksamkeit','Zeit und Geld gehen in das Verfahren'],C:['Stararchitekt direkt beauftragen','maximale internationale Strahlkraft','Einheimische fühlen sich übergangen']},a:'Standardverfahren'},
     {t:'Betrieb und Zugang',o:{B:['Eintritt und Programm für Einheimische','Einnahmen und Angebote für die Bilbaoer','Touristen erhalten weniger Aufmerksamkeit'],C:['Internationale Markenpartnerschaft','Marke und Besucherströme wachsen','Kommerzialisierung, die Lebensqualität sinkt']},a:'Standardbetrieb'}],
 fq:'Wie viele Besucher zieht eine solche Attraktion im ersten vollen Jahr an? (Mio Besucher)',
 reveal:'Bilbao investierte tatsächlich in das Guggenheim. 1992 wurde ein Wettbewerb ausgeschrieben und Frank Gehry gewählt. Im Oktober 1993 begann der Bau, am 18. Oktober 1997 eröffnete das Museum. Es steht auf dem Gelände, auf dem noch Anfang der 1990er Jahre Hafenanlagen lagen.',
 imp:['Du hast wirklich 120 Mio in ein Gebäude gesteckt?','Hast du Schulden getilgt, statt zu investieren? War das Mut oder Angst?','Ihr seid heute Morgen hier vorbeigelaufen. Hättet ihr es erkannt?','Ist ein Leuchtturm Kapitalallokation oder Prestige?','Wer hätte hier lieber in die Universität investiert, und was bringt das nach 2025?']}];

/* ch[r]={opt:key, md:['A','B']} ; upto rounds booked; fin = Finale-Zeitsprung */
function play(ch,upto,fin){
 const k={W:40,I:25,L:35,A:25};let K=500,S=300,PK=100,pend=[];
 for(let r=0;r<upto;r++){const c=ch[r],f=AMT[r]/100;
  for(const [d,kp,v] of OE[c.opt])pend.push([r+d,kp,v*f]);
  PK-=OPK[c.opt];K-=AMT[r];if(c.opt==='Schuldenabbau')S-=AMT[r];
  for(let i=0;i<2;i++){const m=mdDef(r,i,c.md[i]);if(!m)continue;K-=m[0];PK-=m[1];for(const [kp,d,v] of m[2])pend.push([r+d,kp,v])}
  for(const p of pend)if(p[0]===r)k[p[1]]+=p[2];
  if(K<0){S-=K;K=0}K+=3*k.W-.10*S;if(K<0){S-=K;K=0}
  PK-=Math.max(0,(S-500)/100)}
 if(fin)for(const p of pend)if(p[0]>=upto)k[p[1]]+=p[2];
 const kk={};for(const a in k)kk[a]=Math.min(100,Math.max(0,k[a]));
 const kern=3150+2*(100*(.30*kk.W+.25*kk.I+.20*kk.L+.25*kk.A)-3150),pk=Math.max(PK,0);
 return {sw:Math.round(kern*(.85+.15*pk/100)+K-S),debt:Math.round(S),pk:Math.round(PK*10)/10,cash:Math.round(K),k:kk}}

const $=s=>document.querySelector(s);

function chOf(name){const a=[];for(let r=0;r<6;r++){const s=S.subs[r+'_'+name];if(!s)break;a.push({opt:s.opt,md:s.md})}return a}
function chFilled(name,closed,def){const a=[];for(let r=0;r<closed;r++){const s=S.subs[r+'_'+name];a.push(s?{opt:s.opt,md:s.md}:{opt:Object.keys(ROUNDS[r].opts)[0],md:['A','A']})}return a}
function ranking(closed,fin){const rows=PLAYERS.map(n=>({n,...play(chFilled(n,closed),closed,fin)}));rows.push({n:'Historisches Bilbao',hist:true,...play(HIST,closed,fin)});
 rows.sort((a,b)=>b.sw-a.sw||a.debt-b.debt||b.pk-a.pk);return rows}
function memoFirst(){let b=null;for(const n of PLAYERS){const p=S.players[n];if(p&&p.memoAt&&(!b||p.memoAt<b.t))b={n,t:p.memoAt}}return b&&b.n}
function chair(r){if(r===0)return memoFirst();return ranking(r).find(x=>!x.hist).n}

const HL={Industrie:['{n} rettet die Werften und ignoriert den Zeitgeist. Die Gewerkschaft schickt Blumen.','{n} investiert in Stahl. Der Strukturwandel muss warten, er ist ohnehin schlecht gelaunt.','{n} hält an der Industrie fest. Die Zukunft hat angerufen, {n} ist nicht rangegangen.'],
Hafen:['{n} baut den Hafen aus und hofft auf die Weltkonjunktur. Hoffnung ist auch eine Strategie.','{n} setzt auf Kräne und Container. Romantiker nennen das Logistik.','{n} verschiebt Waren statt Weltbilder. Der Hafen wird es richten, hoffentlich.'],
Bildung:['{n} investiert in Bildung. Ergebnisse erwarten wir bis zur nächsten Eiszeit.','{n} baut Schulen für die Arbeitslosen von morgen. Die von heute haben Verständnis.','{n} gründet auf Wissen. Geduld ist hier keine Tugend, sondern ein Geschäftsmodell.'],
Infrastruktur:['{n} erneuert Straßen und Netze. Endlich wissen die Bagger, wofür sie da sind.','{n} baut Infrastruktur. Beton war schon immer ein Zeichen von Zuversicht.','{n} verlegt Rohre und Schienen. Spektakulär wird es erst, wenn es funktioniert.'],
Umwelt:['{n} saniert Fluss und Luft. Die Fische sind begeistert, die Banker nicht.','{n} entdeckt die Umwelt. Wirtschaftlich unklar, aber die Luft ist besser.','{n} macht Bilbao grün und die Kasse rot.'],
Fluss:['{n} saniert den Nervión. Die Fische kehren zurück, die Wähler vielleicht auch.','{n} gibt Geld für den Fluss aus. Ein Stück Natur, das nicht wählen darf.','{n} badet die Stadt im sauberen Wasser. Schwimmen darf man trotzdem noch nicht.'],
Gruen:['{n} pflanzt Parks. Die Bäume bringen keine Rendite, aber Schatten.','{n} setzt auf Grünflächen. Das Stadtklima dankt, die Kasse seufzt.','{n} verwandelt Brachen in Wiesen. Das Gras ist grüner, die Bilanz nicht.'],

Metro:['{n} baut eine Metro. Visionär oder größenwahnsinnig? Beides.','{n} gräbt Tunnel. Foster-Fans jubeln, der Rechnungshof schwitzt.','{n} lässt die Stadt untertunneln. Ein Untergrund-Projekt mit Oberwasser.'],
Strassen:['{n} baut Straßen. Der Autoverband gratuliert.','{n} setzt auf Asphalt. Die Staus werden dadurch angeblich schneller.','{n} zieht neue Asphaltbänder durch die Stadt. Fortschritt riecht nach Teer.'],
Universitaet:['{n} gründet Lehrstühle und hofft auf Erfindungen. Die Studentenkneipen sind vorbereitet.','{n} investiert in die Universität. Gelehrsamkeit ist der neue Stahl.','{n} baut Hörsäle statt Hochöfen. Der Nachwuchs wird es danken, die Kasse später.'],
Gastro:['{n} fördert die Gastronomie. Der Pintxo-Index steigt.','{n} subventioniert Bars. Wirtschaftsförderung mit Aperitif.','{n} macht Bilbao zur Tapas-Hauptstadt. Der Haushalt trinkt mit.'],
Tourismus:['{n} setzt auf Touristen. Bilbao wird zum Postkartenmotiv mit Schulden.','{n} wirbt um Besucher. Die Koffer rollen, die Mieten auch.','{n} setzt auf Postkarten statt Pressen. Hauptsache, die Gäste zahlen.'],
Altstadt:['{n} saniert den Casco Viejo. Die Fassaden glänzen, die Kasse weniger.','{n} poliert die Altstadt. Aufwertung nennt sich hier Stadtentwicklung.','{n} verjüngt den Casco Viejo. Alte Mauern, neue Mieten.'],
Techpark:['{n} baut einen Technologiepark. Die Büros stehen bereit, die Ideen kommen noch.','{n} gründet den Techpark. Ein Zaun, ein Parkplatz, viel Hoffnung.','{n} baut Büros für Ideen, die es noch nicht gibt.'],
Chip:['{n} wettet auf eine Chipfabrik. Mutig oder reif für die Reha?','{n} bestellt Halbleiter in Bilbao. Silicon Valley hat noch nicht zurückgerufen.','{n} will Chips aus Bilbao. Der Weltmarkt lacht vorsichtshalber noch nicht.'],
Forschung:['{n} finanziert Forschung. Die Ergebnisse folgen später, die Rechnungen sofort.','{n} fördert Forscher. Die Kantinenrechnung ist schon da.','{n} gründet Labore. Ergebnisse werden pünktlich nachgereicht.'],

function pickU(pool,seed,used){for(let i=0;i<pool.length;i++){const t=pool[(seed+i)%pool.length];if(!used.has(t))return t}return pool[seed%pool.length]}
function headlines(rows,closed){const out=[];
 if(!closed)return out;const lead=rows[0];out.push(lead.hist?'Marktbericht: Die Geschichte schlägt euch alle. Historisches Bilbao führt.':'Marktbericht: '+lead.n+' führt das Feld an. Die anderen nennen das Zufall.');
 const used=new Set(),cur={};
 for(let r=1;r<=closed;r++){for(const n of PLAYERS){const c=chFilled(n,r)[r-1];if(!c)continue;const pool=HL[c.opt]||['{n} investiert. Das Ergebnis lässt sich blicken.'];
  const t=pickU(pool,n.length+r,used);used.add(t);let line=t.replace(/\{n\}/g,n);

+'<div class="card"><h2>Krisenakte: Bilbao 1990</h2><p>Bilbao war einmal eine der reichsten Städte Spaniens. Eisenerz, Stahlwerke und Werften entlang des Nervión haben die Stadt im 20. Jahrhundert getragen. Heute sind diese Säulen weggebrochen.</p><ul><li><b>Arbeitslosigkeit:</b> rund ein Viertel der Erwerbsfähigen, in einzelnen Vierteln des Großraums noch mehr.</li><li><b>Industrie:</b> Werften und Stahlwerke sind im Weltmarkt nicht mehr konkurrenzfähig. Seit Mitte der 1970er Jahre sind Zehntausende Industriearbeitsplätze verschwunden.</li><li><b>Bevölkerung:</b> Die Stadt schrumpft zum ersten Mal in ihrer Geschichte.</li><li><b>Fluss:</b> Der Nervión ist stark verschmutzt und biologisch fast tot. 1983 hat ein Hochwasser große Teile der Stadt überflutet.</li><li><b>Stadtstruktur:</b> Fabriken, Werften und Hafen liegen am Fluss, und die ärmsten Viertel liegen am linken Ufer. Die Stadt kehrt dem Wasser den Rücken zu.</li></ul><p>Euer Auftrag: Die Stadt hat wenig Geld, wenig Zeit und viele Probleme. Jede Mio, die ihr ausgebt, fehlt woanders.</p></div>'

+'<div class="card"><h2>Eure Hebel bei jeder Station</h2><ol><li><b>Große Investition:</b> Ihr wählt genau eine Option. Der Betrag ist fest (500, 200, 300, 100, 300 und 120 Mio) und wird aus eurer Kasse bezahlt. Jede Option verbessert andere Kennzahlen, oft erst nach ein bis drei Runden, und kostet Politisches Kapital.</li><li><b>Zwei Managemententscheidungen:</b> A kostet nichts und bewirkt nichts. B kostet 30 Mio und 1 Politisches Kapital, C kostet 60 Mio und 3 Politisches Kapital. Dafür wirken sie stärker, haben aber auch Nebenwirkungen. Bei der zweiten gibt es zusätzlich D: eine Steuererhöhung. Sie bringt 60 Mio in die Kasse, kostet aber 6 Politisches Kapital, und die Wirtschaft leidet.</li><li><b>Prognose:</b> Eure Schätzung hat keinen Einfluss auf den Stadtwert. Im Finale seht ihr, wer richtig lag.</li></ol></div>'
+'<div class="card"><h2>Geld und Schulden</h2><ul><li>Ihr startet mit 500 Mio Kasse und 300 Mio Schulden.</li><li>Alles, was ihr ausgebt, kommt aus der Kasse. <b>Reicht sie nicht, wird der Rest automatisch zu Schulden.</b></li><li>Nach jeder Station bekommt ihr Einkommen (das Dreifache eurer Wirtschaftskennzahl in Mio) und zahlt 10 Prozent Zinsen auf eure Schulden.</li><li>Ab 500 Mio Schulden verliert ihr in jeder Runde Politisches Kapital.</li><li>Die sechs Stationen kosten zusammen mehr, als ihr besitzt. Schulden sind also fast unvermeidlich. Die Kunst ist, sie klug einzusetzen.</li></ul></div>'
+'<div class="card"><h2>Weitere Regeln</h2><ul><li>Jeder spielt für sich. Es gibt keine Teams und keine Absprachen.</li><li>Was die Bilbao Economic Times schreiben, ist öffentlich: eure Investitionen und manche Managemententscheidungen. Die Details bleiben bis zum Finale geheim. Die Rangliste ist dauerhaft sichtbar.</li><li>Es gibt keinen Zufall. Wer verliert, hat schlechter entschieden.</li><li>Nach jeder Station führt der <b>Stationssieger</b> (Platz 1 der Rangliste) die Gruppe zur nächsten Station. Nur er sieht, wohin es geht und wie ihr dort hinkommt. Er ist auch Vorsitzender der nächsten Sitzung und liest Situation und Kernfrage laut vor.</li><li>Bei Station 1 übernimmt das, wer sein Strategiememo als Erster abgegeben hat. Dieser Spieler führt die Gruppe auch zu Station 1.</li></ul></div>'

const TXAK={sit:['Ihr sitzt in einer Weinbar. Vor euch steht ein Glas Txakoli, ein leicht perlender, trockener Weißwein aus dem Baskenland. Man trinkt ihn als Aperitif zu Pintxos und gießt ihn traditionell aus großer Höhe ins Glas. Er hat wenig Alkohol, 9,5 bis 11,5 Prozent, und soll innerhalb eines Jahres nach der Abfüllung getrunken werden.','In den 1980er Jahren war Txakoli vor allem ein Hauswein. Er wurde in kleinen Mengen für den Eigenbedarf gemacht. Die Rebflächen waren winzig, die Qualität schwankte, und außerhalb der Region kannte ihn kaum jemand.','Es ist ein kleines Beispiel für eine große Frage: Was macht eine Stadt oder Region mit einem regionalen Produkt, das gut sein könnte?'],
 q:'Sollte die öffentliche Hand Qualitätssteigerungen fördern? Oder sollte der Markt allein entscheiden?',qx:'Txakoli ist nicht einfach ein Getränk. Txakoli ist eine Kapitalallokationsfrage.',
